# =============================================================================
# YFrame .NET CI/CD 流水线 (GitLab CI 格式)
# 平台: gitcode.com (AtomGit) — 基于 GitLab
# 项目: C# .NET 8.0 WPF 模块化桌面框架
# =============================================================================
# 说明:
#   - 本流水线仅编译 YFrame 和 YF_Manager 两个核心项目
#   - 测试项目 YFrame.Tests 依赖外部 YF_KMScript 插件，不在 CI 中编译
#   - 本地测试请使用: dotnet test YFrame.Tests/YFrame.Tests.csproj
#   - 需要 Windows Runner，gitcode.com 共享 runner 可能只有 Linux，
#     若无 Windows runner 请到 Settings → CI/CD → Runners 自行注册
# =============================================================================

stages:
  - build

variables:
  DOTNET_VERSION: "8.0"

build:
  stage: build
  tags:
    - windows
  script:
    - Write-Host "=== 还原 YF_Manager 依赖 ==="
    - dotnet restore YF_Manager/YF_Manager.csproj
    - Write-Host "=== 还原 YFrame 依赖 ==="
    - dotnet restore YFrame/YFrame.csproj
    - Write-Host "=== 编译 YF_Manager (Release) ==="
    - dotnet build YF_Manager/YF_Manager.csproj --no-restore --configuration Release
    - Write-Host "=== 编译 YFrame (Release) ==="
    - dotnet build YFrame/YFrame.csproj --no-restore --configuration Release
