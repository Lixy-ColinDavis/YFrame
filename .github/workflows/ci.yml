# =============================================================================
# YFrame .NET CI/CD 工作流
# 平台: gitcode.com (AtomGit) — 兼容 GitHub Actions 格式
# 项目: C# .NET 8.0 WPF 模块化桌面框架
# =============================================================================
# 说明:
#   - 本工作流编译 YFrame、YF_Manager 两个核心项目及 YFrame.Tests 测试项目
#   - KMScript 相关的单元测试已移除（对应 YF_KMScript 插件不在此仓库中）
# =============================================================================

name: .NET 编译与测试

on:
  push: # 触发条件
    branches: [ main, master ] # 监听的分支
    paths-ignore: # 当变更仅涉及以下目录不触发
      - "**.md"
      - "Review/**"
      - "Log/**"
      - ".gitignore"
  pull_request: # 合并分支到
    branches: [ main, master ]
  workflow_dispatch:   # 允许 GitHub Actions 手动触发

env:
  DOTNET_VERSION: "8.0.x"

jobs:

  build:
    name: 编译检查 (Build)
    runs-on: windows-latest

    steps:
      # ---- 检出仓库 ----
      - name: 检出代码
        uses: actions/checkout@v4

      # ---- 安装 .NET 8.0 SDK ----
      - name: 安装 .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      # ---- 还原 NuGet 包 ----
      - name: 还原 YF_Manager 依赖
        run: dotnet restore YF_Manager/YF_Manager.csproj

      - name: 还原 YFrame 依赖
        run: dotnet restore YFrame/YFrame.csproj

      - name: 还原 YFrame.Tests 依赖
        run: dotnet restore YFrame.Tests/YFrame.Tests.csproj

      # ---- 编译核心项目 (Release) ----
      - name: 编译 YF_Manager
        run: dotnet build YF_Manager/YF_Manager.csproj --no-restore --configuration Release

      - name: 编译 YFrame
        run: dotnet build YFrame/YFrame.csproj --no-restore --configuration Release

      # ---- 编译并运行单元测试 ----
      - name: 编译 YFrame.Tests
        run: dotnet build YFrame.Tests/YFrame.Tests.csproj --no-restore --configuration Release

      - name: 运行单元测试
        run: dotnet test YFrame.Tests/YFrame.Tests.csproj --no-build --configuration Release --verbosity normal
